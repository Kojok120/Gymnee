<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!--
  App Store スクリーンショットパネル（issue #135「筋トレゆるゲーム」版）。
  ヘッドレス Chromium で URL ハッシュ（#01〜#08）を指定してレンダリングする（build.sh 参照）。
  キャラ・ボス・ペットは promo/sprites/*.png（DEBUG 画面 PromoArtSheet から promo/build_sprites.sh で切り出し）。
  文言・配置は下部 <script> の PANELS を編集して再ビルドする。座標は 1320×2868 の実寸 px。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#C6FF3D; --ink:#16121F; --white:#FFFDF6;
  --title:"M PLUS Rounded 1c","Zen Kaku Gothic New",sans-serif;
  --pixel:"DotGothic16",monospace;
  --jp:"Zen Kaku Gothic New",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1320px;height:2868px;overflow:hidden;background:#111}
.panel{position:absolute;inset:0;overflow:hidden}

/* 星（夜空のパネル用） */
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:6px;height:6px;background:#fff;opacity:.7}

/* 見出し（上部） */
.copy{position:absolute;left:0;right:0;top:150px;text-align:center;z-index:30}
.eyebrow{display:inline-block;font-family:var(--pixel);font-size:44px;letter-spacing:.12em;color:var(--ink);
  background:var(--lime);padding:10px 30px;border:5px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink)}
h1{white-space:nowrap;margin-top:36px;font-family:var(--title);font-weight:900;font-size:136px;line-height:1.2;color:var(--white);letter-spacing:.02em;
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink)}
h1 .lime{color:var(--lime)}
.sub{margin:34px auto 0;font-family:var(--jp);font-weight:900;font-size:50px;color:var(--white);
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;max-width:1240px;white-space:nowrap}

/* キービジュアルの題字（下部） */
.logo{position:absolute;left:0;right:0;text-align:center;z-index:40}
.logo .big{white-space:nowrap;font-family:var(--title);font-weight:900;font-size:190px;line-height:1.08;color:var(--white);
  -webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:0 18px 0 var(--ink),0 0 80px rgba(198,255,61,.5)}
.logo .big .lime{color:var(--lime)}
.logo .tag{display:inline-block;white-space:nowrap;margin-top:30px;font-family:var(--jp);font-weight:900;font-size:64px;color:var(--ink);
  background:var(--white);border:7px solid var(--ink);border-radius:999px;padding:14px 54px;box-shadow:0 12px 0 var(--ink)}
.logo .name{margin-top:34px;font-family:var(--pixel);font-size:54px;letter-spacing:.3em;color:var(--white);
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill}

/* 端末 */
.phone{position:absolute;width:820px;left:250px;border-radius:118px;padding:28px;z-index:10;
  background:linear-gradient(160deg,#4A514B,#171A18);border:4px solid var(--ink);
  box-shadow:0 30px 0 rgba(0,0,0,.35)}
.phone .screen{border-radius:92px;overflow:hidden;background:#000}
.phone img{display:block;width:100%}

/* ドット絵の素材 */
.sp{position:absolute;image-rendering:pixelated;filter:drop-shadow(0 10px 0 rgba(0,0,0,.28))}
.sp.flip{transform:scaleX(-1)}

/* 吹き出し・ダメージ・バッジ */
.bubble{position:absolute;z-index:35;font-family:var(--pixel);font-size:46px;color:var(--ink);white-space:nowrap;
  background:var(--white);border:6px solid var(--ink);border-radius:26px;padding:12px 28px;box-shadow:0 8px 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:40px;bottom:-26px;border:14px solid transparent;border-top:16px solid var(--ink)}
.bubble.r::after{left:auto;right:40px}
.hit{position:absolute;z-index:36;font-family:var(--title);font-weight:900;font-size:120px;color:var(--lime);
  -webkit-text-stroke:12px var(--ink);paint-order:stroke fill;transform:rotate(-8deg)}
.badge{position:absolute;z-index:36;font-family:var(--jp);font-weight:900;font-size:44px;color:#fff;
  border:6px solid var(--ink);border-radius:999px;padding:8px 28px;box-shadow:0 8px 0 var(--ink);white-space:nowrap}
.spark{position:absolute;z-index:34;font-family:var(--pixel);font-size:80px;color:#FFE27A;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.moon{position:absolute;border-radius:50%;z-index:1;background:radial-gradient(circle at 38% 35%,#FFF6E0 0%,#F6D9B8 45%,#D9A98E 75%,#B98276 100%);box-shadow:0 0 120px 40px rgba(255,210,170,.45)}
</style>
</head>
<body>
<div id="root"></div>

    ],
    bubbles: [{t:"ファイト！",x:60,y:1640},{t:"おつかれ！",x:920,y:1700,r:true}]
  },

  // 7. AI コーチ
  "07": {
    bg: "linear-gradient(180deg,#0E2A4A 0%,#1F5A8A 50%,#7EC8E3 100%)",
    eyebrow: "AI COACH",
    h: '迷ったら<br><span class="lime">コーチに相談！</span>',

    sprites: [
      {n:"coach", x:170, y:2620, h:460, z:20},

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function starsHTML(){
  let h='<div class="stars">';
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  for(let i=0;i<90;i++){const x=rnd()*1320,y=rnd()*1500,s=rnd()<.2?10:6;h+=`<i style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;opacity:${.3+rnd()*.6}"></i>`}
  return h+'</div>';
}
// 素材は「足元（下端の中央）」を (x, y) に置く。
function spriteHTML(s){
  const tr=[s.flip?"scaleX(-1)":"", s.rot?`rotate(${s.rot}deg)`:""].join(" ");
  return `<img class="sp" src="${S(s.n)}" style="height:${s.h}px;left:${s.x}px;top:${s.y}px;z-index:${s.z||5};transform:translate(-50%,-100%) ${tr}">`;
}
function panelHTML(p){
  let h=`<div class="panel" style="background:${p.bg}">`;
  if(p.stars) h+=starsHTML();
  if(p.moon){const m=p.moon;h+=`<div class="moon" style="left:${m.x-m.r}px;top:${m.y-m.r}px;width:${m.r*2}px;height:${m.r*2}px"></div>`}
  (p.glows||[]).forEach(g=>{h+=`<div class="glow" style="left:${g.x-g.r}px;top:${g.y-g.r}px;width:${g.r*2}px;height:${g.r*2}px;background:radial-gradient(circle,${g.c},transparent 70%)"></div>`});
  if(p.h){
    h+=`<div class="copy"><span class="eyebrow">${esc(p.eyebrow)}</span><h1>${p.h}</h1><p class="sub">${esc(p.sub)}</p></div>`;
  }
  if(p.phone){
    h+=`<div class="phone" style="top:${p.phone.y}px"><div class="screen"><img src="${p.phone.img}"></div></div>`;
  }
  (p.sprites||[]).forEach(s=>{h+=spriteHTML(s)});
  (p.hits||[]).forEach(t=>{h+=`<div class="hit" style="left:${t.x}px;top:${t.y}px;transform:rotate(${t.rot||-8}deg)">${esc(t.t)}</div>`});
  (p.sparks||[]).forEach(t=>{h+=`<div class="spark" style="left:${t.x}px;top:${t.y}px">✦</div>`});
  (p.badges||[]).forEach(b=>{h+=`<div class="badge" style="left:${b.x}px;top:${b.y}px;background:${b.c};transform:translateX(-50%)">${esc(b.t)}</div>`});
  (p.bubbles||[]).forEach(b=>{h+=`<div class="bubble ${b.r?"r":""}" style="left:${b.x}px;top:${b.y}px">${esc(b.t).replace(/\n/g,"<br>")}</div>`});
  if(p.logo){
    h+=`<div class="logo" style="top:${p.logo.y}px"><div class="big">${p.logo.big}</div><div class="tag">${esc(p.logo.tag)}</div><div class="name">${esc(p.logo.name)}</div></div>`;
  }
  return h+"</div>";
}
const id=(location.hash||"#01").slice(1);
document.getElementById("root").innerHTML=panelHTML(PANELS[id]);

// 文の途中で改行させない（issue #135）。見出し・説明・題字は折り返しを禁止し、
// 幅に収まらなければ文字を小さくして1行に収める。改行は PANELS の <br> で決めた位置だけ。
// 要素の枠ではなく、中の文字が実際に占める幅を測る（ブロック要素の枠は常に全幅になるため）。
function textWidth(el){
  const r=document.createRange(); r.selectNodeContents(el);
  return r.getBoundingClientRect().width;
}
function fitWidth(el, max){
  let size=parseFloat(getComputedStyle(el).fontSize);
  while(textWidth(el)>max && size>20){ size-=2; el.style.fontSize=size+"px"; }
}
document.fonts.ready.then(()=>{
  document.querySelectorAll(".sub,.logo .tag").forEach(el=>fitWidth(el,1240));
  document.querySelectorAll("h1,.logo .big").forEach(el=>fitWidth(el,1260));
  document.body.dataset.fitted="1";
});
</script>
</body>
</html>
